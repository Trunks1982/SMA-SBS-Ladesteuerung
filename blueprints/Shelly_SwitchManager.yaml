blueprint:
  name: Shelly Gen2 Taster – schnelle Klickerkennung
  description: >
    Erkennt Single/Double/Triple-Klick selbst über btn_up-Events mit
    konfigurierbarem Klick-Fenster, statt auf die langsame Firmware-Erkennung
    (double_push/triple_push) zu warten. Long-Push inkl. Halten-zum-Dimmen.
  domain: automation
  input:
    shelly_device:
      name: Shelly Gerät
      selector:
        device:
          integration: shelly
    channel:
      name: Eingang / Kanal
      description: Beim Plus 1 immer 0, beim Plus i4 0–3.
      default: 0
      selector:
        number:
          min: 0
          max: 3
          mode: box
    click_window:
      name: Klick-Fenster (ms)
      description: >
        Zeit, in der ein weiterer Klick als Doppel-/Dreifachklick zählt.
        Kleiner = schneller, aber man muss zügiger klicken. 300 ist ein guter Start.
      default: 300
      selector:
        number:
          min: 100
          max: 1000
          step: 10
          unit_of_measurement: ms
    single_action:
      name: Einfach-Klick
      default: []
      selector:
        action: {}
    double_action:
      name: Doppel-Klick
      default: []
      selector:
        action: {}
    triple_action:
      name: Dreifach-Klick
      default: []
      selector:
        action: {}
    long_action:
      name: Long-Push – Beginn
      description: Wird ausgeführt, sobald die Firmware long_push meldet.
      default: []
      selector:
        action: {}
    long_release_action:
      name: Long-Push – Loslassen
      default: []
      selector:
        action: {}
    dim_light:
      name: Licht zum Dimmen beim Halten (optional)
      description: >
        Ist hier ein Licht gewählt, wird beim Halten gedimmt. Richtung automatisch:
        Licht aus oder unter 50 % → heller, sonst dunkler.
      default: ""
      selector:
        entity:
          domain: light
    dim_step:
      name: Dimm-Schritt (%)
      default: 10
      selector:
        number:
          min: 2
          max: 25
          unit_of_measurement: "%"
    dim_interval:
      name: Dimm-Intervall (ms)
      default: 250
      selector:
        number:
          min: 100
          max: 1000
          step: 50
          unit_of_measurement: ms

# Wichtig: single + silent, damit der 2./3. Klick vom laufenden
# wait_for_trigger gefangen wird und nicht eine neue Instanz startet.
mode: single
max_exceeded: silent

trigger:
  - platform: event
    event_type: shelly.click
    id: up
    event_data:
      device_id: !input shelly_device
      channel: !input channel
      click_type: btn_up
  - platform: event
    event_type: shelly.click
    id: long
    event_data:
      device_id: !input shelly_device
      channel: !input channel
      click_type: long_push

variables:
  dim_light: !input dim_light
  dim_step: !input dim_step

action:
  - choose:
      # ---------------- LONG PUSH ----------------
      - conditions: "{{ trigger.id == 'long' }}"
        sequence:
          - choose: []
            default: !input long_action
          - if:
              - condition: template
                value_template: "{{ dim_light != '' }}"
            then:
              - variables:
                  dim_direction: >
                    {% set b = state_attr(dim_light, 'brightness') | int(0) %}
                    {{ -1 if (is_state(dim_light, 'on') and b > 128) else 1 }}
              - repeat:
                  until: "{{ wait.trigger is not none or repeat.index >= 60 }}"
                  sequence:
                    - service: light.turn_on
                      target:
                        entity_id: "{{ dim_light }}"
                      data:
                        brightness_step_pct: "{{ dim_step * dim_direction }}"
                    - wait_for_trigger:
                        - platform: event
                          event_type: shelly.click
                          event_data:
                            device_id: !input shelly_device
                            channel: !input channel
                            click_type: btn_up
                      timeout:
                        milliseconds: !input dim_interval
            else:
              # btn_up nach dem Long-Push "verbrauchen", damit er nicht als Single zählt
              - wait_for_trigger:
                  - platform: event
                    event_type: shelly.click
                    event_data:
                      device_id: !input shelly_device
                      channel: !input channel
                      click_type: btn_up
                timeout:
                  seconds: 15
          - choose: []
            default: !input long_release_action

      # ---------------- KLICK-ERKENNUNG ----------------
      - conditions: "{{ trigger.id == 'up' }}"
        sequence:
          # Warten auf 2. Klick
          - wait_for_trigger:
              - platform: event
                event_type: shelly.click
                event_data:
                  device_id: !input shelly_device
                  channel: !input channel
                  click_type: btn_up
            timeout:
              milliseconds: !input click_window
          - if:
              - condition: template
                value_template: "{{ wait.trigger is none }}"
            then: !input single_action
            else:
              # Warten auf 3. Klick
              - wait_for_trigger:
                  - platform: event
                    event_type: shelly.click
                    event_data:
                      device_id: !input shelly_device
                      channel: !input channel
                      click_type: btn_up
                timeout:
                  milliseconds: !input click_window
              - if:
                  - condition: template
                    value_template: "{{ wait.trigger is none }}"
                then: !input double_action
                else: !input triple_action
