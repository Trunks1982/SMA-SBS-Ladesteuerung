blueprint:
  name: Shelly Gen2 Taster – schnelle Klickerkennung
  description: >
    Erkennt Single/Double/Triple-Klick selbst über btn_up-Events mit
    konfigurierbarem Klick-Fenster. Long-Push dimmt alle gewählten Lampen,
    die gerade an sind.
  domain: automation
  input:
    shelly_device:
      name: Shelly Gerät
      selector:
        device:
          filter:
            - integration: shelly
    channel:
      name: Eingang / Kanal
      description: Wert aus dem Event (`channel`) übernehmen. Bei deinem Plus 1 war es 1.
      default: 0
      selector:
        number:
          min: 0
          max: 4
          mode: box
    click_window:
      name: Klick-Fenster (ms)
      description: Zeit, in der ein weiterer Klick als Doppel-/Dreifachklick zählt.
      default: 300
      selector:
        number:
          min: 100
          max: 1000
          step: 10
          unit_of_measurement: ms
    single_action:
      name: Einfach-Klick
      default: []
      selector:
        action: {}
    double_action:
      name: Doppel-Klick
      default: []
      selector:
        action: {}
    triple_action:
      name: Dreifach-Klick
      default: []
      selector:
        action: {}
    dim_lights:
      name: Dimmbare Lampen
      description: Beim Halten werden nur die Lampen gedimmt, die gerade an sind.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: light
    dim_step:
      name: Dimm-Schritt (%)
      default: 10
      selector:
        number:
          min: 2
          max: 25
          unit_of_measurement: "%"
    dim_interval:
      name: Dimm-Intervall (ms)
      default: 200
      selector:
        number:
          min: 50
          max: 500
          step: 10
          unit_of_measurement: ms
    dim_direction_helper:
      name: Dimm-Richtung Helper (optional)
      description: >
        Input Boolean. Wenn gesetzt, wechselt die Richtung bei jedem Long-Push ab.
        Leer lassen = Richtung nach durchschnittlicher Helligkeit.
      default: ""
      selector:
        entity:
          filter:
            - domain: input_boolean

mode: single
max_exceeded: silent

triggers:
  - trigger: event
    event_type: shelly.click
    event_data:
      device_id: !input shelly_device
      channel: !input channel
      click_type: btn_up
    id: up
  - trigger: event
    event_type: shelly.click
    event_data:
      device_id: !input shelly_device
      channel: !input channel
      click_type: long_push
    id: long

variables:
  dim_lights: !input dim_lights
  dim_step: !input dim_step
  dim_helper: !input dim_direction_helper

actions:
  - choose:
      # ---------- LONG PUSH: dimmen ----------
      - conditions:
          - condition: trigger
            id: long
        sequence:
          - variables:
              on_lights: >
                {{ expand(dim_lights) | selectattr('state', 'eq', 'on')
                   | map(attribute='entity_id') | list }}
              direction: >
                {% if dim_helper not in ['', none] %}
                  {{ 1 if is_state(dim_helper, 'off') else -1 }}
                {% else %}
                  {% set br = expand(on_lights) | map(attribute='attributes.brightness')
                              | map('int', 0) | list %}
                  {{ -1 if br and (br | average) > 128 else 1 }}
                {% endif %}
          - repeat:
              sequence:
                - if:
                    - condition: template
                      value_template: >
                        {{ expand(on_lights) | selectattr('state', 'eq', 'on') | list | count > 0 }}
                  then:
                    - action: light.turn_on
                      target:
                        entity_id: >
                          {{ expand(on_lights) | selectattr('state', 'eq', 'on')
                             | map(attribute='entity_id') | list }}
                      data:
                        brightness_step_pct: "{{ direction | int * dim_step | int }}"
                # Intervall abwarten – Loslassen beendet die Schleife sofort
                - wait_for_trigger:
                    - trigger: event
                      event_type: shelly.click
                      event_data:
                        device_id: !input shelly_device
                        channel: !input channel
                        click_type: btn_up
                  timeout:
                    milliseconds: !input dim_interval
                  continue_on_timeout: true
              until:
                - condition: template
                  value_template: "{{ wait.trigger is not none or repeat.index >= 300 }}"
          - if:
              - condition: template
                value_template: "{{ dim_helper not in ['', none] and on_lights | count > 0 }}"
            then:
              - action: input_boolean.toggle
                target:
                  entity_id: "{{ dim_helper }}"

      # ---------- KLICKS zählen ----------
      - conditions:
          - condition: trigger
            id: up
        sequence:
          - wait_for_trigger:
              - trigger: event
                event_type: shelly.click
                event_data:
                  device_id: !input shelly_device
                  channel: !input channel
                  click_type: btn_up
            timeout:
              milliseconds: !input click_window
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: "{{ wait.trigger is none }}"
            then: !input single_action
            else:
              - wait_for_trigger:
                  - trigger: event
                    event_type: shelly.click
                    event_data:
                      device_id: !input shelly_device
                      channel: !input channel
                      click_type: btn_up
                timeout:
                  milliseconds: !input click_window
                continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: "{{ wait.trigger is none }}"
                then: !input double_action
                else: !input triple_action
